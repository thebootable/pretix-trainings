[project]
name = "pretix-schulungen"
dynamic = ["version"]
description = "Raumverwaltung, mehrtaegige Kurse und Teilnahmebescheinigungen fuer pretix-Schulungen"
readme = "README.rst"
license = {text = "Apache"}
keywords = ["pretix"]
authors = [
    {name = "Tobias Berndt", email = "claude.tobi@die-wg.vodka"},
]
maintainers = [
    {name = "Tobias Berndt", email = "claude.tobi@die-wg.vodka"},
]

dependencies = [
]

[project.entry-points."pretix.plugin"]
pretix_schulungen = "pretix_schulungen:PretixPluginMeta"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools",
    "pretix-plugin-build",
]

[project.urls]
homepage = "https://github.com/example-org/pretix-schulungen"
repository = "https://github.com/example-org/pretix-schulungen"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pretix_schulungen.__version__"}

[tool.setuptools.packages.find]
include = ["pretix*"]
namespaces = false
